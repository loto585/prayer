name: prayer-napcat

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      # NapCat entrypoint uses -q for the selected QQ account on restart.
      # Override with NAPCAT_ACCOUNT when deploying another bot account.
      ACCOUNT: ${NAPCAT_ACCOUNT:-3433146658}
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - napcat-config:/app/napcat/config
      - napcat-qq:/app/.config/QQ
      - napcat-plugins:/app/napcat/plugins

volumes:
  napcat-config:
  napcat-qq:
  napcat-plugins:
